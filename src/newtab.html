<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: 'unsafe-inline'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: https: http:; font-src 'self' file: data:; connect-src https://ipapi.co https://ipwho.is https://get.geojs.io https://api.bigdatacloud.net https://api.open-meteo.com; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>MAUZER</title>
    <link rel="stylesheet" href="fonts/inter.css">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            /* centering is done by .container{margin:auto} — it keeps the
               content reachable on narrow windows instead of clipping both
               edges like justify-content:center does */
            transition: background-color 0.35s cubic-bezier(0.4, 0, 0.2, 1), color 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
        }

        [data-theme="light"] body,
        [data-theme="light"] html {
            background: #ffffff;
            color: rgba(0, 0, 0, 0.9);
        }

        /* === Animated background scene === */
        .bg-scene {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        /* Vignette to keep edges deep and dark */
        .bg-scene::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
        }

        .aurora {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            mix-blend-mode: screen;
            opacity: 0.55;
            will-change: transform;
        }

        .aurora-1 {
            top: -22%;
            left: -12%;
            width: 62vw;
            height: 62vw;
            background: radial-gradient(circle at 35% 35%, rgba(79, 70, 229, 0.5) 0%, rgba(79, 70, 229, 0.12) 45%, transparent 68%);
            animation: drift-1 28s steps(116, end) infinite;
        }

        .aurora-2 {
            bottom: -28%;
            right: -14%;
            width: 68vw;
            height: 68vw;
            background: radial-gradient(circle at 60% 60%, rgba(8, 145, 178, 0.45) 0%, rgba(8, 145, 178, 0.1) 45%, transparent 68%);
            animation: drift-2 36s steps(150, end) infinite;
        }

        .aurora-3 {
            top: 18%;
            right: 12%;
            width: 44vw;
            height: 44vw;
            background: radial-gradient(circle at 50% 40%, rgba(147, 51, 234, 0.38) 0%, rgba(147, 51, 234, 0.1) 45%, transparent 68%);
            animation: drift-3 24s steps(150, end) infinite;
        }

        .aurora-4 {
            bottom: 6%;
            left: 16%;
            width: 38vw;
            height: 38vw;
            background: radial-gradient(circle at 45% 55%, rgba(14, 165, 233, 0.3) 0%, rgba(14, 165, 233, 0.08) 45%, transparent 68%);
            animation: drift-4 32s steps(133, end) infinite;
        }

        @keyframes drift-1 {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            33% { transform: translate3d(9vw, 7vh, 0) scale(1.12); }
            66% { transform: translate3d(-5vw, 12vh, 0) scale(0.94); }
        }

        @keyframes drift-2 {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            40% { transform: translate3d(-10vw, -8vh, 0) scale(1.08); }
            70% { transform: translate3d(4vw, -14vh, 0) scale(0.92); }
        }

        @keyframes drift-3 {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
            50% { transform: translate3d(-8vw, 10vh, 0) scale(1.15) rotate(12deg); }
        }

        @keyframes drift-4 {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            45% { transform: translate3d(7vw, -9vh, 0) scale(1.1); }
            75% { transform: translate3d(-6vw, -4vh, 0) scale(0.95); }
        }

        /* Constellation particles canvas (drawn by JS) */
        #fx-canvas {
            position: absolute;
            inset: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .aurora, .wi-scene, .wi-scene * { animation: none !important; }
        }

        /* === Low-power tier (html.low-power, set by the head script) ===
           Old CPUs: same scene, minus the layers that cost the most.
           - 4th aurora blob (pure composite load, least visual loss)
           - local glow: a blurred 800x400 layer repainting ~12x/s
           - neon sweep: masked gradient repainting ~25x/s
           Canvas and weather icon animations stay (both are cheap). */
        html.low-power .aurora-4,
        html.low-power .local-glow-bg {
            display: none;
        }

        /* blend mode is extra composite work per frame — normal on low tier */
        html.low-power .aurora {
            mix-blend-mode: normal;
        }

        html.low-power .search-wrap::before {
            animation: none;
            opacity: 0;
        }

        /* On software rendering (Win7) every animation step forces a
           full-window recomposite, so cost tracks step RATE, not layer size.
           Measured: aurora ~4.6% CPU, the 28px weather icon ~3.5% (its spin
           fires ~25 steps/s!), canvas 25fps ~2.3%. The icon goes static and
           the aurora drift slows ~2.5x on the low tier — still alive, but
           its steps now fall under the canvas frame rate. */
        html.low-power .aurora-1 { animation-duration: 70s; }
        html.low-power .aurora-2 { animation-duration: 90s; }
        html.low-power .aurora-3 { animation-duration: 60s; }
        html.low-power .aurora-4 { animation-duration: 80s; }
        html.low-power .wi-scene,
        html.low-power .wi-scene * {
            animation: none !important;
        }

        /* blur(110px) is THE most expensive layer on software rendering
           (Win7 always renders on CPU): every step of every drifting blob
           re-rasterizes the whole screen. The radial gradients already fade
           to transparent, so without the filter they stay soft. */
        html.low-power .aurora {
            filter: none;
        }

        /* The widget's backdrop blur re-filters the moving scene behind it
           every frame; on the low tier swap the frost for a solid tint. */
        html.low-power .weather-widget::before {
            display: none;
        }
        html.low-power .weather-widget {
            background: rgba(26, 26, 26, 0.78);
        }
        html[data-theme="light"].low-power .weather-widget {
            background: rgba(245, 245, 245, 0.85);
        }

        /* Unfold animates layout properties (width/max-height/max-width) —
           a reflow every frame. On the low tier toggle instantly instead. */
        html.low-power .weather-widget,
        html.low-power .weather-widget.no-anim,
        html.low-power .weather-expanded,
        html.low-power .weather-expanded .weather-details,
        html.low-power .weather-expanded .forecast-item {
            transition: none !important;
        }

        /* Pulsing box-shadow repaints while suggestions are open */
        html.low-power body.suggestions-open .search-bar,
        html.low-power body.suggestions-open .suggestions {
            animation: none;
        }

        /* Idle freeze: after 20s without input JS adds .idle on <html> —
           every background scene animation pauses until the next input */
        html.idle .aurora,
        html.idle .local-glow-bg,
        html.idle .search-wrap::before,
        html.idle .wi-scene,
        html.idle .wi-scene * {
            animation-play-state: paused !important;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 0 24px;
            position: relative;
            z-index: 1;
            /* margin:auto centers in the flex body AND keeps the left edge
               reachable when the window is narrower than the content —
               plain justify-content:center would clip it (see search bar) */
            margin: auto;
        }

        /* Local animated glow behind search and widgets */
        .local-glow-bg {
            position: absolute;
            top: 250px; /* Adjust based on logo height */
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
            animation: pulse-glow 6s steps(37, end) infinite;
            border-radius: 50%;
            filter: blur(20px);
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; transform: translateX(-50%) scale(0.95); }
            50% { opacity: 0.8; transform: translateX(-50%) scale(1.05); }
        }

        [data-theme="light"] .local-glow-bg {
            background: radial-gradient(circle, rgba(0,0,0,0.03) 0%, transparent 60%);
        }

        /* === LOGO === */
        .logo-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 48px;
        }

        .logo {
            width: 420px;
            max-width: 80vw;
            height: auto;
            object-fit: contain;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.06));
        }



        /* === SEARCH === */
        .search-wrap {
            width: 100%;
            max-width: 700px;
            position: relative;
            margin-bottom: 56px;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 3;
        }

        .search-wrap:hover {
            transform: scale(1.02);
        }

        /* === WEATHER WIDGET === */
        .weather-widget {
            position: absolute;
            top: 16px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            cursor: pointer;
            overflow: hidden;
            transition: width 0.42s cubic-bezier(0.33, 0, 0.15, 1),
                        background-color 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        /* The blur lives on an oversized static layer that never resizes —
           the browser doesn't re-compute the backdrop while the pill animates,
           so the frost stays on continuously instead of popping in late */
        .weather-widget::before {
            content: '';
            position: absolute;
            inset: -60px;
            z-index: -1;
            pointer-events: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .weather-widget:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .weather-icon-svg {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            position: relative;
            transition: opacity .35s ease;
        }
        .weather-icon-svg svg {
            width: 100%;
            height: 100%;
        }

        /* Animated weather icon scene */
        .wi-scene {
            position: absolute;
            inset: 0;
            --wi-cloud-fill: #21262d;
        }
        [data-theme="light"] .wi-scene {
            --wi-cloud-fill: #ffffff;
        }
        .wi-cloud {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 24px;
            height: 24px;
            animation: wi-drift 3.6s steps(22, end) infinite;
        }
        .wi-sun {
            position: absolute;
            top: 0;
            left: 0;
            width: 28px;
            height: 28px;
        }
        .wi-sun circle {
            transform-box: fill-box;
            transform-origin: center;
            animation: wi-pulse 3.2s steps(20, end) infinite;
        }
        .wi-rays {
            transform-box: fill-box;
            transform-origin: center;
            animation: wi-spin 16s steps(200, end) infinite;
        }
        /* combined sun-behind-cloud icon: one SVG, cloud overlaps sun cleanly */
        .wi-daysun {
            position: absolute;
            top: 3px;
            left: 0;
            width: 28px;
            height: 21px;
        }
        .wi-daysun .wi-cloud-g {
            transform-box: fill-box;
            transform-origin: center;
            animation: wi-drift 3.6s steps(22, end) infinite;
        }
        .wi-drop {
            position: absolute;
            top: 20px;
            width: 2px;
            height: 5.5px;
            border-radius: 1px;
            background: #60a5fa;
            animation: wi-fall 1.4s steps(12, end) infinite;
        }
        .wi-drop.d1 { left: 8px; }
        .wi-drop.d2 { left: 12.5px; animation-delay: .46s; }
        .wi-drop.d3 { left: 17px; animation-delay: .93s; }
        .wi-flake {
            position: absolute;
            top: 20px;
            width: 2.5px;
            height: 2.5px;
            border-radius: 50%;
            background: #e2e8f0;
            animation: wi-snow 3.4s steps(21, end) infinite;
        }
        .wi-flake.s1 { left: 8px; }
        .wi-flake.s2 { left: 12.5px; animation-delay: 1.1s; }
        .wi-flake.s3 { left: 17px; animation-delay: 2.2s; }
        .wi-bolt {
            position: absolute;
            top: 14px;
            left: 9px;
            width: 9px;
            height: 13px;
            animation: wi-flash 1.7s steps(7, end) infinite;
        }
        .wi-fogline {
            position: absolute;
            left: 4px;
            right: 4px;
            height: 1.6px;
            border-radius: 1px;
            background: #9ca3af;
            animation: wi-fog 3s steps(19, end) infinite;
        }
        .wi-fogline.f1 { top: 20px; }
        .wi-fogline.f2 { top: 24px; animation-delay: 1.5s; }

        @keyframes wi-drift {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(1.5px); }
        }
        @keyframes wi-spin {
            to { transform: rotate(360deg); }
        }
        @keyframes wi-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        @keyframes wi-fall {
            0% { transform: translateY(0); opacity: 0; }
            18% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(9px); opacity: 0; }
        }
        @keyframes wi-snow {
            0% { transform: translate(0, 0); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translate(2px, 9px); opacity: 0; }
        }
        @keyframes wi-flash {
            0%, 55%, 100% { opacity: .25; }
            60%, 70%, 80% { opacity: 1; }
            75% { opacity: .4; }
        }
        @keyframes wi-fog {
            0%, 100% { transform: translateX(-1.5px); opacity: .4; }
            50% { transform: translateX(1.5px); opacity: .85; }
        }

        .weather-info {
            display: flex;
            align-items: center;
        }

        .weather-temp {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.1;
            color: rgba(255, 255, 255, 0.9);
        }

        .weather-loc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            overflow: hidden;
            white-space: nowrap;
            margin-left: 8px;
            max-width: 140px;
            opacity: 1;
            transition: max-width .42s cubic-bezier(0.33, 0, 0.15, 1),
                        margin-left .42s cubic-bezier(0.33, 0, 0.15, 1),
                        opacity .35s ease;
        }

        /* Collapsed pill stays compact — the town name only shows expanded */
        .weather-widget:not(.expanded) .weather-loc {
            margin-left: 0;
            max-width: 0;
            opacity: 0;
        }

        /* Width measurement helper — disables transitions for one frame */
        .weather-widget.no-anim,
        .weather-widget.no-anim * {
            transition: none !important;
        }

        /* Expanded widget (in-place, smooth unfold) */
        .weather-expanded {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
            max-height: 0;
            /* hidden content must not stretch the collapsed pill */
            max-width: 0;
            opacity: 0;
            transform: translateY(-6px);
            /* height travels ~250px, width ~180px — durations are scaled so
               both edges move at the same visual speed */
            transition: max-height 0.55s cubic-bezier(0.33, 0, 0.15, 1),
                        max-width 0.42s cubic-bezier(0.33, 0, 0.15, 1),
                        opacity 0.4s ease,
                        transform 0.5s cubic-bezier(0.33, 0, 0.15, 1);
        }
        .weather-widget.expanded {
            width: 280px;
            padding: 14px 18px;
        }
        .weather-widget.expanded .weather-expanded {
            max-height: 250px;
            max-width: 280px;
            opacity: 1;
            transform: translateY(0);
        }

        /* Rows cascade in after the panel unfolds; they drop instantly
           (no delay) when collapsing so the fold stays snappy */
        .weather-expanded .weather-details,
        .weather-expanded .forecast-item {
            opacity: 0;
            transform: translateY(-5px);
            transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.33, 0, 0.15, 1);
        }
        .weather-widget.expanded .weather-details {
            transition-delay: 0.14s;
            opacity: 1;
            transform: translateY(0);
        }
        .weather-widget.expanded .forecast-item:nth-child(1) {
            transition-delay: 0.2s;
            opacity: 1;
            transform: translateY(0);
        }
        .weather-widget.expanded .forecast-item:nth-child(2) {
            transition-delay: 0.26s;
            opacity: 1;
            transform: translateY(0);
        }
        .weather-widget.expanded .forecast-item:nth-child(3) {
            transition-delay: 0.32s;
            opacity: 1;
            transform: translateY(0);
        }
        .weather-details {
            display: flex;
            gap: 16px;
            margin-bottom: 18px;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .weather-detail-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .weather-detail-item .detail-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.4);
        }
        .weather-detail-item .detail-value {
            font-size: 15px;
            font-weight: 600;
        }
        .weather-forecast {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .forecast-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
        }

        .forecast-day {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.65);
            min-width: 90px;
        }

        .forecast-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .forecast-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .forecast-temp {
            font-size: 13px;
            font-weight: 600;
        }

        [data-theme="light"] .weather-widget {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.1);
        }
        [data-theme="light"] .weather-widget:hover {
            background: rgba(0, 0, 0, 0.08);
            border-color: rgba(0, 0, 0, 0.15);
        }
        [data-theme="light"] .weather-temp {
            color: rgba(0, 0, 0, 0.85);
        }
        [data-theme="light"] .weather-loc {
            color: rgba(0, 0, 0, 0.45);
        }
        [data-theme="light"] .weather-details {
            border-color: rgba(0, 0, 0, 0.1);
        }
        [data-theme="light"] .weather-detail-item .detail-label {
            color: rgba(0, 0, 0, 0.4);
        }
        [data-theme="light"] .forecast-day {
            color: rgba(0, 0, 0, 0.55);
        }
        [data-theme="light"] .forecast-item {
            background: rgba(0, 0, 0, 0.04);
        }
        [data-theme="light"] .forecast-day {
            color: rgba(0, 0, 0, 0.6);
        }
        [data-theme="light"] .forecast-temp {
            color: rgba(0, 0, 0, 0.85);
        }

        @keyframes fadeInDown {
            to { opacity: 1; transform: translateY(0); }
        }

        .search-bar {
            width: 100%;
            height: 56px;
            padding: 0 56px 0 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            outline: none;
            color: #fff;
            font-size: 17px;
            font-family: inherit;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
            user-select: text;
            -webkit-user-select: text;
            -ms-user-select: text;
        }

        .search-bar:hover {
            border-color: rgba(255, 255, 255, 0.18);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2),
                0 0 15px rgba(255, 255, 255, 0.04),
                0 0 30px rgba(255, 255, 255, 0.02);
        }

        .search-bar:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(255, 255, 255, 0.06),
                0 0 40px rgba(255, 255, 255, 0.03);
        }

        /* Suggestions Styles */
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(18, 18, 18, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: none;
            border-radius: 0 0 28px 28px;
            padding: 8px 0;
            list-style: none;
            z-index: 100;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
            max-height: 300px;
            overflow-y: auto;
            overflow-x: hidden;
            backdrop-filter: none;
            -ms-overflow-style: none; /* IE/Edge */
            scrollbar-width: none; /* Firefox */
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(10px) scale(0.98);
            transition: opacity 240ms var(--ease), transform 260ms var(--ease), visibility 0s linear 260ms;
            will-change: opacity, transform;
        }

        .suggestions.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0) scale(1);
            transition: opacity 240ms var(--ease), transform 260ms var(--ease), visibility 0s;
        }

        .suggestion-item {
            padding: 10px 20px;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: background 0.1s;
        }

        .suggestion-item:hover, .suggestion-item.selected {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .suggestion-icon {
            width: 16px;
            height: 16px;
            opacity: 0.5;
            color: #fff;
            flex-shrink: 0;
        }

    <script>
        // Low-power tier: decided ONCE before first paint so weak machines
        // never see (then lose) the expensive layers. Old dual-core / 2 GB
        // boxes get the same scene with fewer layers to composite.
        (function () {
            try {
                const cores = navigator.hardwareConcurrency || 4;
                const mem = navigator.deviceMemory || 4;
                if (cores <= 2 || mem <= 2) {
                    document.documentElement.classList.add('low-power');
                }
            } catch (e) {}
            // The sync heuristic above misses old 4-core boxes — main.js knows
            // better (Win7 always renders on CPU; RAM < 4.5 GB also counts).
            // Adding the class later is fine: CSS applies instantly, and the
            // canvas retunes itself via the class MutationObserver.
            try {
                if (window.mauzer && window.mauzer.app && window.mauzer.app.getInfo) {
                    window.mauzer.app.getInfo().then(function (info) {
                        if (info && (info.isWin7 || info.isLowEnd)) {
                            document.documentElement.classList.add('low-power');
                        }
                    }).catch(function () {});
                }
            } catch (e) {}
        })();
    </script>

    <script>
        // === Constellation particles (canvas, ~30 fps, paused when hidden) ===
        (function initConstellation() {
            const canvas = document.getElementById('fx-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const LINK_DIST = 140;       // max px distance for a connecting line
            // The tier class may arrive AFTER this script (async app:getInfo
            // for Win7/low-RAM machines), so watch for it and retune live.
            // 20 fps full / 15 fps low tier: every frame is a full-window
            // software recomposite, and 20 reads just as smooth as 25 for
            // slow-drifting particles.
            let lowPower = document.documentElement.classList.contains('low-power');
            let FRAME_MS = 1000 / (lowPower ? 15 : 20); // fps cap — same motion, fewer paints
            let DPR = Math.min(window.devicePixelRatio || 1, lowPower ? 1 : 1.5);
            new MutationObserver(() => {
                const lp = document.documentElement.classList.contains('low-power');
                if (lp !== lowPower) {
                    lowPower = lp;
                    FRAME_MS = 1000 / (lp ? 15 : 20);
                    if (lp) DPR = Math.min(DPR, 1);
                    resize();
                }
            }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

            let W = 0, H = 0, particles = [], rafId = 0, lastFrame = 0;
            let isLight = false;
            // Auto-degradation: if frames keep arriving late (weak CPU under
            // load), particle count drops a step — never back up, so a brief
            // spike can't cause oscillation. The tier adds its own factor.
            let quality = 1;
            let slowFrames = 0;

            function spawn() {
                const vx = (Math.random() - 0.5) * 48; // px per second
                const vy = (Math.random() - 0.5) * 48;
                return {
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx, vy,
                    r: 1 + Math.random() * 1.4,
                    sp: Math.hypot(vx, vy) || 1 // own speed — the slower point anchors the line
                };
            }

            function resize() {
                const oldW = W, oldH = H;
                W = window.innerWidth;
                H = window.innerHeight;
                // Fresh tabs can briefly report a 0x0 viewport — spawning into
                // it would pile every particle at (0,0) and they'd stay as a
                // clump in the corner after the window grows. Wait for real size.
                if (!W || !H) return;
                canvas.width = Math.round(W * DPR);
                canvas.height = Math.round(H * DPR);
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                // Rescale existing particles BEFORE adding new ones — keeps the
                // spread uniform when the viewport grows/shrinks (otherwise
                // particles spawned for the small initial size pile up in the
                // corners right after the browser opens). New particles spawned
                // below already use the fresh full-size W/H.
                if (oldW > 0 && oldH > 0 && (oldW !== W || oldH !== H)) {
                    const kx = W / oldW, ky = H / oldH;
                    for (const p of particles) {
                        p.x *= kx;
                        p.y *= ky;
                    }
                }
                // Density scales with area, hard-capped so big screens stay cheap
                const base = Math.min(100, Math.max(40, Math.round((W * H) / 14000)));
                const target = Math.max(24, Math.round(base * quality * (lowPower ? 0.6 : 1)));
                while (particles.length < target) particles.push(spawn());
                particles.length = Math.min(particles.length, target);
            }

            function draw(dt) {
                // Light theme gets darker, slightly stronger ink so it stays visible
                const rgb = isLight ? '13,13,13' : '255,255,255';
                const dotA = isLight ? 0.65 : 0.5;
                const lineMax = isLight ? 0.28 : 0.18;

                ctx.clearRect(0, 0, W, H);

                // All dots share one style — batch them into a single path
                // and one fill call (moveTo before each arc keeps them
                // unconnected); same picture, ~100x fewer draw calls
                ctx.beginPath();
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
                    if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
                    ctx.moveTo(p.x + p.r, p.y);
                    ctx.arc(p.x, p.y, p.r, 0, 6.2832);
                }
                ctx.fillStyle = 'rgba(' + rgb + ',' + dotA + ')';
                ctx.fill();

                // Threads too: one path, one stroke. Every line has the same
                // color and width, so batching changes nothing visually
                const d2max = LINK_DIST * LINK_DIST;
                ctx.beginPath();
                for (let i = 0; i < particles.length; i++) {
                    const a = particles[i];
                    for (let j = i + 1; j < particles.length; j++) {
                        const b = particles[j];
                        const dx = a.x - b.x, dy = a.y - b.y;
                        const d2 = dx * dx + dy * dy;
                        if (d2 >= d2max) continue;
                        const t = 1 - Math.sqrt(d2) / LINK_DIST;
                        // The slower point is the anchor: the thread stays attached
                        // to the one that "stayed" and stretches toward the runner.
                        const anchor = a.sp <= b.sp ? a : b;
                        const other = anchor === a ? b : a;
                        // Short connection band so the line never dangles far
                        // into empty space: appears close, disappears quickly.
                        let g = (t - 0.35) / 0.3;
                        g = g <= 0 ? 0 : g >= 1 ? 1 : g * g * (3 - 2 * g);
                        if (g <= 0.01) continue;
                        const ex = anchor.x + (other.x - anchor.x) * g;
                        const ey = anchor.y + (other.y - anchor.y) * g;
                        // Full opacity the whole time — the line retracts, not fades
                        ctx.moveTo(anchor.x, anchor.y);
                        ctx.lineTo(ex, ey);
                    }
                }
                ctx.strokeStyle = 'rgba(' + rgb + ',' + lineMax + ')';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            let frameCount = 0;
            function loop(ts) {
                rafId = requestAnimationFrame(loop);
                if (!lastFrame) { lastFrame = ts; return; }
                const elapsed = ts - lastFrame;
                if (elapsed < FRAME_MS) return;
                // Auto-degrade: sustained late frames (real slowness, not
                // occlusion throttling) shrink the particle count one step
                if (elapsed > FRAME_MS * 1.8 && elapsed < 500) {
                    if (++slowFrames > 15 && quality > 0.4) {
                        quality -= 0.25;
                        slowFrames = 0;
                        resize();
                    }
                } else {
                    slowFrames = 0;
                }
                // Cheap safety net (~once a second): if the viewport changed
                // without a resize event firing, catch up
                if ((++frameCount & 31) === 0 &&
                    (window.innerWidth !== W || window.innerHeight !== H)) {
                    resize();
                }
                draw(Math.min(elapsed / 1000, 0.1));
                lastFrame = ts;
            }

            function start() {
                if (!rafId && !reducedMotion) {
                    lastFrame = 0;
                    rafId = requestAnimationFrame(loop);
                }
            }

            function stop() {
                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = 0;
                }
            }

            function applyMode() {
                isLight = (document.documentElement.getAttribute('data-theme') || 'dark') === 'light';
                if (reducedMotion) {
                    stop();
                    draw(0);
                } else {
                    start();
                }
            }

            // React to theme switches from settings
            new MutationObserver(applyMode)
                .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

            // No work at all while the page is hidden
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) stop(); else if (!isIdle) applyMode();
            });

            // === Idle freeze ===
            // The scene keeps animating even when nobody is looking. After
            // IDLE_MS without any input the canvas stops and .idle on <html>
            // pauses the aurora/glow/neon/weather-icon CSS animations; any
            // input (mouse, keys, scroll) wakes everything instantly.
            const IDLE_MS = 20000;
            let idleTimer = 0;
            let isIdle = false;
            // Not 0: the first wake() call must ARM the idle timer. With 0 the
            // throttle (now - lastWake < 2000) swallowed it, so on a machine
            // with no input after launch the freeze never armed and every
            // scene animation ran forever (constant compositor burn).
            let lastWake = -IDLE_MS;

            function enterIdle() {
                isIdle = true;
                document.documentElement.classList.add('idle');
                stop();
            }

            function wake() {
                const now = performance.now();
                // Input storms (mousemove etc.) reset the timer at most every 2s
                if (!isIdle && now - lastWake < 2000) return;
                lastWake = now;
                if (isIdle) {
                    isIdle = false;
                    document.documentElement.classList.remove('idle');
                    applyMode();
                }
                clearTimeout(idleTimer);
                idleTimer = setTimeout(enterIdle, IDLE_MS);
            }

            ['mousemove', 'mousedown', 'wheel', 'keydown', 'touchstart']

            wake();

            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    resize();
                    if (reducedMotion) draw(0);

        }

        async function saveQuickLink() {
            const rawUrl = addUrlInput.value;
            const url = normalizeUrl(rawUrl);
            if (!url) {
                addUrlInput.focus();
                return;
            }
            let hostname = '';
            try { hostname = new URL(url).hostname; } catch (e) { }
            const title = (addTitleInput.value || hostname || url).trim();
            if (!title) return;
            quickLinks.push({ url, title });
            if (window.mauzer?.quicklinks?.save) {
                await window.mauzer.quicklinks.save(quickLinks);
            }
            renderLinks(quickLinks);
            closeAddModal();
        }

        addCancel.addEventListener('click', closeAddModal);
        addSave.addEventListener('click', saveQuickLink);
        addModal.addEventListener('click', (e) => {
            if (e.target === addModal || e.target.classList.contains('modal-backdrop')) closeAddModal();
        });
        addUrlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveQuickLink();
        });
        addTitleInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveQuickLink();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && addModal.classList.contains('show')) closeAddModal();
        });

        document.getElementById('search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                if (!val) return;
                const isUrl = /^(https?:\/\/|[\w-]+\.[\w-]+)/.test(val);
                window.location.href = isUrl
                    ? (val.startsWith('http') ? val : 'https://' + val)
                    : 'https://www.google.com/search?q=' + encodeURIComponent(val);
            }
        });

        const searchWrap = document.querySelector('.search-wrap');
        if (searchWrap) {
            searchWrap.classList.remove('neon-flash');
        }

        // Apply theme (settings win over the URL param — a stale ?theme= baked
        // into the tab URL must not survive a reload; the param is only used
        // for the first paint and as a fallback when settings are unavailable)
        const params = new URLSearchParams(window.location.search);
        const themeFromParam = params.get('theme');

        function applyTheme(theme) {
            const t = (theme || 'dark').toLowerCase();
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark';
        }

        if (themeFromParam) {
            applyTheme(themeFromParam);
        }
        if (window.mauzer?.settings?.load) {
            window.mauzer.settings.load().then(s => applyTheme(s?.theme || 'dark')).catch(() => {});
        }

        if (window.mauzer?.settings?.onChanged) {
            window.mauzer.settings.onChanged((s) => {
                applyTheme(s?.theme || 'dark');
            });
        }

        // === WEATHER LOGIC ===
        async function initWeather() {
            const widget = document.getElementById('weather-widget');
            const iconEl = document.getElementById('weather-icon');
            const tempEl = document.getElementById('weather-temp');
            const locEl = document.getElementById('weather-loc');
            const humidityEl = document.getElementById('weather-humidity');
            const windEl = document.getElementById('weather-wind');
            const forecastEl = document.getElementById('weather-forecast');

            // Privacy: weather resolves the user's location via IP geolocation
            // services. When the setting is off — hide the widget and make zero
            // network requests. Toggling the setting reloads this page.
            let weatherShown = true;
            try {
                const s = await window.mauzer.settings.load();
                if (s && s.weatherEnabled === false) {
                    weatherShown = false;
                    widget.style.display = 'none';
                    return;
                }
                if (window.mauzer.settings.onChanged) {
                    window.mauzer.settings.onChanged((ns) => {
                        const on = !ns || ns.weatherEnabled !== false;
                        if (on !== weatherShown) location.reload();
                    });
                }
            } catch (e) { }

            // Click widget -> toggle expanded.
            // Width is pinned to explicit px before toggling, because CSS cannot
            // animate between a fixed width and `auto` — without this the
            // collapse would snap instantly.
            // Natural collapsed width, measured ahead of time. Measuring it
            // inside the click handler (class flip-flop) breaks the height
            // transition, so it's cached instead.
            let naturalW = 98;
            function measureNatural() {
                widget.classList.add('no-anim');
                const wasExpanded = widget.classList.contains('expanded');
                widget.classList.remove('expanded');
                widget.style.width = 'auto';
                naturalW = Math.round(widget.getBoundingClientRect().width) || naturalW;
                widget.classList.toggle('expanded', wasExpanded);
                widget.classList.remove('no-anim');
                widget.style.width = '';
            }

            // The blur layer is static (see .weather-widget::before), so the
            // animation no longer needs to disable it
            widget.addEventListener('click', () => {
                const isExpanded = widget.classList.contains('expanded');
                const current = widget.getBoundingClientRect().width;
                const target = isExpanded ? naturalW : 280; // natural ↔ .expanded width
                widget.style.width = current + 'px';
                void widget.offsetWidth; // reflow so the pinned start width takes effect
                widget.classList.toggle('expanded', !isExpanded);
                widget.style.width = target + 'px';
                clearTimeout(widget._widthTimer);
                widget._widthTimer = setTimeout(() => { widget.style.width = ''; }, 700);
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && widget.classList.contains('expanded')) {
                    widget.classList.remove('expanded');
                }
            });

            const wmoToKey = (c) => {
                if (c >= 1 && c <= 2) return 'cloud-sun';
                if (c === 3) return 'cloud';
                if (c >= 45 && c <= 48) return 'fog';
                if (c >= 51 && c <= 67) return 'rain';
                if (c >= 71 && c <= 86) return 'snow';
                if (c >= 95) return 'thunder';
                return 'sun';
            };

            const iconsSvg = {
                'sun': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>',
                'cloud-sun': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>',
                'cloud': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>',
                'rain': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M8 19v2M12 19v2M16 19v2"/></svg>',
                'snow': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><circle cx="8" cy="21" r="0.5"/><circle cx="12" cy="21" r="0.5"/><circle cx="16" cy="21" r="0.5"/></svg>',
                'thunder': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M13 12l-2 4h4l-2 4"/></svg>',
                'fog': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14M5 12h14M5 16h14M5 20h14"/></svg>'
            };

            // data:image versions for forecast <img>
            const iconsDataUri = {};
            for (const [k, v] of Object.entries(iconsSvg)) {
                iconsDataUri[k] = 'data:image/svg+xml,' + encodeURIComponent(v);
            }

            // Animated main icon: drifting cloud, falling rain/snow, flashing
            // bolt, spinning sun rays — driven by CSS, no JS per frame
            const buildAnimatedIcon = (kind) => {
                const cloudSvg = (color) =>
                    `<svg class="wi-cloud" viewBox="0 0 24 24" fill="var(--wi-cloud-fill)" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`;
                if (kind === 'sun') {
                    return `<div class="wi-scene"><svg class="wi-sun" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><g class="wi-rays"><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></g></svg></div>`;
                }
                if (kind === 'cloud-sun') {
                    return `<div class="wi-scene"><svg class="wi-daysun" viewBox="0 0 32 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="#fbbf24" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M9 2.4V0.6M3.4 8H1.6M4 3l-1.3-1.3M14 3l1.3-1.3"/></g><g class="wi-cloud-g"><path d="M23.5 22.5H13a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" fill="var(--wi-cloud-fill)" stroke="#94a3b8" stroke-width="1.9"/></g></svg></div>`;
                }
                if (kind === 'cloud') {
                    return `<div class="wi-scene">${cloudSvg('#94a3b8')}</div>`;
                }
                if (kind === 'rain') {
                    return `<div class="wi-scene">${cloudSvg('#60a5fa')}<span class="wi-drop d1"></span><span class="wi-drop d2"></span><span class="wi-drop d3"></span></div>`;
                }
                if (kind === 'snow') {
                    return `<div class="wi-scene">${cloudSvg('#e2e8f0')}<span class="wi-flake s1"></span><span class="wi-flake s2"></span><span class="wi-flake s3"></span></div>`;
                }
                if (kind === 'thunder') {
                    return `<div class="wi-scene">${cloudSvg('#94a3b8')}<svg class="wi-bolt" viewBox="0 0 24 24"><path d="M13 2 L8.5 13 L12 13 L10 22 L16 10.5 L12.5 10.5 Z" fill="#fbbf24"/></svg><span class="wi-drop d1"></span><span class="wi-drop d3"></span></div>`;
                }
                if (kind === 'fog') {
                    return `<div class="wi-scene">${cloudSvg('#9ca3af')}<span class="wi-fogline f1"></span><span class="wi-fogline f2"></span></div>`;
                }
                return buildAnimatedIcon('sun');
            };

            // Swaps the icon with a soft crossfade when the weather changes
            const setWeatherIcon = (kind) => {
                const html = buildAnimatedIcon(kind);
                if (iconEl.innerHTML === html) return;
                iconEl.style.opacity = '0';
                setTimeout(() => {
                    iconEl.innerHTML = html;
                    iconEl.style.opacity = '1';
                }, 350);
            };

            const isPlaceName = (n) => !!n && !/район|district|область|oblast|region|обл\./i.test(n);

            // Location resolution. Privacy: the cached place is checked FIRST,
            // so the IP geo providers are contacted roughly once per 14 days —
            // not on every new tab and not on every 30-minute refresh.
            async function resolveLocation() {
                // Last successfully resolved place (expires after 14 days —
                // this also drops old pre-timestamp caches on first read)
                try {
                    const cached = JSON.parse(localStorage.getItem('mauzer-weather-loc') || 'null');
                    if (cached && cached.ts && Date.now() - cached.ts <= 14 * 24 * 3600 * 1000 &&
                        isFinite(cached.lat) && isFinite(cached.lon) && cached.city) {
                        return { lat: cached.lat, lon: cached.lon, city: cached.city };
                    }
                } catch (e) { }

                // IP geo providers, first working wins. Coordinates matter —
                // the display name comes from reverse geocoding below.
                let lat, lon, city;
                try {
                    const geoRes = await fetch('https://ipapi.co/json/');
                    if (!geoRes.ok) throw new Error('Primary geo failed');
                    const geo = await geoRes.json();
                    if (!geo.latitude || !geo.longitude) throw new Error('No coords');
                    lat = geo.latitude; lon = geo.longitude;
                    city = geo.city || geo.region || 'Unknown';
                } catch (err1) {
                    try {
                        const r2 = await fetch('https://ipwho.is/');
                        if (!r2.ok) throw new Error('ipwho failed');
                        const d2 = await r2.json();
                        if (!d2.latitude || !d2.longitude) throw new Error('No coords');
                        lat = d2.latitude; lon = d2.longitude;
                        city = d2.city || d2.region || 'Unknown';
                    } catch (err2) {
                        try {
                            const geoRes2 = await fetch('https://get.geojs.io/v1/ip/geo.json');
                            if (!geoRes2.ok) throw new Error('Backup geo failed');
                            const geo2 = await geoRes2.json();
                            if (!geo2.latitude || !geo2.longitude) throw new Error('No coords');
                            lat = parseFloat(geo2.latitude); lon = parseFloat(geo2.longitude);
                            city = geo2.city || geo2.region || 'Unknown';
                        } catch (err3) {
                            // All providers failed: the hardcoded fallback.
                            // ~10 km precision is plenty for weather and keeps the
                            // exact home coordinates out of the shipped source.
                            // Not cached, so providers are retried on next load.
                            return { lat: 50.0, lon: 35.6, city: 'Краснокутск' };
                        }
                    }
                }

                // IP geo often reports the regional center (e.g. Kharkiv) —
                // reverse-geocode the coordinates to get the exact locality
                // (e.g. Krasnokutsk) and remember it for next time.
                // District names ("Шевченковский район" etc.) are rejected:
                // IP coords drift between the town and the regional center, so
                // a district name means the resolution keeps the geoip city.
                try {
                    const revRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ru`);
                    if (revRes.ok) {
                        const rev = await revRes.json();
                        const candidates = [rev.locality, rev.city, ...(Array.isArray(rev.localityInfo?.informative) ? rev.localityInfo.informative.map(i => i.name) : [])];
                        const place = candidates.find(isPlaceName);
                        if (place) {
                            city = place;
                            try {
                                // ~1 km precision + timestamp for the 14-day expiry
                                localStorage.setItem('mauzer-weather-loc', JSON.stringify({
                                    lat: Math.round(lat * 100) / 100,
                                    lon: Math.round(lon * 100) / 100,
                                    city: place,
                                    ts: Date.now()
                                }));
                            } catch (e) { }
                        }
                    }
                } catch (e) { /* keep the geoip city */ }

                return { lat, lon, city };
            }

            async function loadWeather() {
            try {
                const loc = await resolveLocation();

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weathercode,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto`);
                if (!weatherRes.ok) throw new Error('Weather failed');
                const weather = await weatherRes.json();

                const cur = weather.current || {};
                const temp = Math.round(cur.temperature_2m ?? cur.temperature ?? 0);
                const code = cur.weathercode ?? 0;
                const humidity = Math.round(cur.relative_humidity_2m ?? 0);
                const wind = Math.round(cur.wind_speed_10m ?? 0);
                const icon = wmoToKey(code);

                // Update widget (icon crossfades if the kind changed)
                setWeatherIcon(icon);
                tempEl.textContent = `${temp > 0 ? '+' : ''}${temp}°`;
                locEl.textContent = loc.city;
                humidityEl.textContent = `${humidity}%`;
                windEl.textContent = `${wind} м/с`;

                // Forecast 3 days
                if (weather?.daily?.time && Array.isArray(weather.daily.time)) {
                    forecastEl.innerHTML = '';
                    const times = weather.daily.time;
                    const maxTemps = weather.daily.temperature_2m_max || [];
                    const minTemps = weather.daily.temperature_2m_min || [];
                    const codes = weather.daily.weathercode || [];

                    const todayIdx = times.findIndex(t => t === (cur.time || '').split('T')[0]);
                    const labels = ['Завтра', 'Послезавтра', 'Через 3 дня'];

                    forecastEl.innerHTML = [1, 2, 3].map((offset, idx) => {
                        const i = todayIdx >= 0 ? todayIdx + offset : offset;
                        if (!times[i]) return '';
                        const max = Math.round(maxTemps[i] ?? temp);
                        const min = Math.round(minTemps[i] ?? temp);
                        const fIcon = iconsDataUri[wmoToKey(codes[i] ?? 0)];
                        return `<div class="forecast-item">
                            <span class="forecast-day">${labels[idx]}</span>
                            <div class="forecast-meta">
                                <img class="forecast-icon" src="${fIcon}" alt="" />
                                <span class="forecast-temp">${max > 0 ? '+' : ''}${max}° / ${min > 0 ? '+' : ''}${min}°</span>
                            </div>
                        </div>`;
                    }).join('');
                }

            } catch (e) {
                console.error('Weather error:', e);
                locEl.textContent = 'Нет данных';
            }
            }

            await loadWeather();
            measureNatural();
            // Refresh every 30 min so an open tab picks up weather changes
            setInterval(async () => {
                await loadWeather();
                measureNatural();
            }, 30 * 60 * 1000);
            window.addEventListener('resize', measureNatural);
        }

        initWeather();
    </script>
</body>

</html>

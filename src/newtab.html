    <script>
        // === Constellation particles (canvas, ~30 fps, paused when hidden) ===
        (function initConstellation() {
            const canvas = document.getElementById('fx-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const LINK_DIST = 140;       // max px distance for a connecting line
            
            // ОПТИМИЗАЦИЯ: Spatial Hash для быстрого поиска соседей O(n) вместо O(n²)
            class SpatialHash {
                constructor(cellSize = 140) {
                    this.cellSize = cellSize;
                    this.grid = new Map();
                }
                
                clear() { this.grid.clear(); }
                
                key(x, y) {
                    return `${Math.floor(x / this.cellSize)},${Math.floor(y / this.cellSize)}`;
                }
                
                insert(particle) {
                    const k = this.key(particle.x, particle.y);
                    if (!this.grid.has(k)) this.grid.set(k, []);
                    this.grid.get(k).push(particle);
                }
                
                nearby(particle) {
                    const cx = Math.floor(particle.x / this.cellSize);
                    const cy = Math.floor(particle.y / this.cellSize);
                    const result = [];
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dy = -1; dy <= 1; dy++) {
                            const k = `${cx + dx},${cy + dy}`;
                            if (this.grid.has(k)) result.push(...this.grid.get(k));
                        }
                    }
                    return result;
                }
            }
            
            const spatialHash = new SpatialHash(LINK_DIST);
            // The tier class may arrive AFTER this script (async app:getInfo
            // for Win7/low-RAM machines), so watch for it and retune live.
            // 20 fps full / 15 fps low tier: every frame is a full-window
            // software recomposite, and 20 reads just as smooth as 25 for
            // slow-drifting particles.
            let lowPower = document.documentElement.classList.contains('low-power');
            let FRAME_MS = 1000 / (lowPower ? 15 : 20); // fps cap — same motion, fewer paints
            let DPR = Math.min(window.devicePixelRatio || 1, lowPower ? 1 : 1.5);
            new MutationObserver(() => {
                const lp = document.documentElement.classList.contains('low-power');
                if (lp !== lowPower) {
                    lowPower = lp;
                    FRAME_MS = 1000 / (lp ? 15 : 20);
                    if (lp) DPR = Math.min(DPR, 1);
                    resize();
                }
            }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

            let W = 0, H = 0, particles = [], rafId = 0, lastFrame = 0;
            let isLight = false;
            // Auto-degradation: if frames keep arriving late (weak CPU under
            // load), particle count drops a step — never back up, so a brief
            // spike can't cause oscillation. The tier adds its own factor.
            let quality = 1;
            let slowFrames = 0;

            // 3D Parallax & Mouse Interactivity
            const auroraWrap = document.getElementById('aurora-wrap');
            let currentPX = 0, currentPY = 0;
            let targetPX = 0, targetPY = 0;
            const mouse = {
                x: -1000,
                y: -1000,
                targetX: -1000,
                targetY: -1000,
                active: false
            };

            window.addEventListener('mousemove', (e) => {
                mouse.targetX = e.clientX;
                mouse.targetY = e.clientY;
                if (!mouse.active) {
                    mouse.x = e.clientX;
                    mouse.y = e.clientY;
                    mouse.active = true;
                }
                wake();
            }, { passive: true });

            window.addEventListener('mouseleave', () => {
                mouse.active = false;
            }, { passive: true });

            window.addEventListener('mouseenter', (e) => {
                mouse.targetX = e.clientX;
                mouse.targetY = e.clientY;
                mouse.active = true;
            }, { passive: true });

            function spawn() {
                const vx = (Math.random() - 0.5) * 48; // px per second
                const vy = (Math.random() - 0.5) * 48;
                return {
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx, vy,
                    r: 1 + Math.random() * 1.4,
                    sp: Math.hypot(vx, vy) || 1, // own speed — the slower point anchors the line
                    phase: Math.random() * 6.283,
                    pulseSpeed: 1.2 + Math.random() * 1.8,
                    glow: Math.random() < 0.35 // 35% of dots have a gentle ambient glow
                };
            }

            function resize() {
                // Sized to the full screen/monitor bounds so opening/closing the sidebar
                // NEVER stretches, squashes, clears, or re-allocates the canvas buffer.
                const screenW = Math.max(window.screen.availWidth || 1920, window.innerWidth || 1920, 1920);
                const screenH = Math.max(window.screen.availHeight || 1080, window.innerHeight || 1080, 1080);

                if (W === screenW && H === screenH && canvas.width > 0) return;

                W = screenW;
                H = screenH;

                canvas.style.position = 'fixed';
                canvas.style.top = '0';
                canvas.style.left = '0';
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';

                const targetW = Math.round(W * DPR);
                const targetH = Math.round(H * DPR);
                if (canvas.width !== targetW || canvas.height !== targetH) {
                    canvas.width = targetW;
                    canvas.height = targetH;
                    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                }

                // Initial spawn on first load (zero teleportation on subsequent resizes)
                if (particles.length === 0) {
                    const screenArea = W * H;
                    const base = Math.min(85, Math.max(45, Math.round(screenArea / 18000)));
                    const target = Math.max(30, Math.round(base * quality * (lowPower ? 0.6 : 1)));
                    while (particles.length < target) particles.push(spawn());
                    particles.length = Math.min(particles.length, target);
                }
            }

            function draw(dt) {
                // Light theme gets darker, slightly stronger ink so it stays visible
                const rgb = isLight ? '13,13,13' : '255,255,255';
                const dotA = isLight ? 0.65 : 0.5;
                const lineMax = isLight ? 0.28 : 0.18;

                ctx.clearRect(0, 0, W, H);

                // 1. All dots share base core style — batch them into a single path
                // and one fill call (moveTo before each arc keeps them unconnected);
                // same picture, ~100x fewer draw calls
                ctx.beginPath();
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.phase += p.pulseSpeed * dt;

                    if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
                    if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
                    ctx.moveTo(p.x + p.r, p.y);
                    ctx.arc(p.x, p.y, p.r, 0, 6.2832);
                }
                ctx.fillStyle = 'rgba(' + rgb + ',' + dotA + ')';
                ctx.fill();

                // 2. Animated subtle glow/illumination on background dots (batched, zero CPU overhead)
                if (!lowPower) {
                    // Soft aura halo around glowing dots
                    ctx.beginPath();
                    for (let i = 0; i < particles.length; i++) {
                        const p = particles[i];
                        if (p.glow) {
                            const pulse = 0.5 + 0.5 * Math.sin(p.phase);
                            const haloR = p.r * (2.0 + 1.2 * pulse);
                            ctx.moveTo(p.x + haloR, p.y);
                            ctx.arc(p.x, p.y, haloR, 0, 6.2832);
                        }
                    }
                    ctx.fillStyle = isLight ? 'rgba(59, 130, 246, 0.13)' : 'rgba(147, 197, 253, 0.16)';
                    ctx.fill();

                    // Subtle sparkling center highlight during pulse peak
                    ctx.beginPath();
                    for (let i = 0; i < particles.length; i++) {
                        const p = particles[i];
                        if (p.glow) {
                            const pulse = Math.sin(p.phase);
                            if (pulse > 0.25) {
                                const sparkR = p.r * (0.8 + 0.35 * pulse);
                                ctx.moveTo(p.x + sparkR, p.y);
                                ctx.arc(p.x, p.y, sparkR, 0, 6.2832);
                            }
                        }
                    }
                    ctx.fillStyle = isLight ? 'rgba(37, 99, 235, 0.45)' : 'rgba(255, 255, 255, 0.7)';
                    ctx.fill();
                }

                // ОПТИМИЗАЦИЯ: Spatial Hash для быстрого поиска соседей
                // Вместо O(n²) проверки всех пар используем O(n)
                spatialHash.clear();
                particles.forEach(p => spatialHash.insert(p));
                
                const d2max = LINK_DIST * LINK_DIST;
                const processed = new Set();
                ctx.beginPath();
                
                for (const a of particles) {
                    const nearby = spatialHash.nearby(a);
                    for (const b of nearby) {
                        if (a === b) continue;
                        // Избегаем дублирования линий
                        const pairKey = a.x < b.x ? `${a.x},${a.y}-${b.x},${b.y}` : `${b.x},${b.y}-${a.x},${a.y}`;
                        if (processed.has(pairKey)) continue;
                        processed.add(pairKey);
                        
                        const dx = a.x - b.x, dy = a.y - b.y;
                        const d2 = dx * dx + dy * dy;
                        if (d2 >= d2max) continue;
                        const t = 1 - Math.sqrt(d2) / LINK_DIST;
                        const anchor = a.sp <= b.sp ? a : b;
                        const other = anchor === a ? b : a;
                        let g = (t - 0.35) / 0.3;
                        g = g <= 0 ? 0 : g >= 1 ? 1 : g * g * (3 - 2 * g);
                        if (g <= 0.01) continue;
                        const ex = anchor.x + (other.x - anchor.x) * g;
                        const ey = anchor.y + (other.y - anchor.y) * g;
                        ctx.moveTo(anchor.x, anchor.y);
                        ctx.lineTo(ex, ey);
                    }
                }
                ctx.strokeStyle = 'rgba(' + rgb + ',' + lineMax + ')';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            let frameCount = 0;
            function loop(ts) {
                rafId = requestAnimationFrame(loop);
                if (!lastFrame) { lastFrame = ts; return; }
                const elapsed = ts - lastFrame;
                if (elapsed < FRAME_MS) return;
                // Auto-degrade: sustained late frames (real slowness, not
                // occlusion throttling) shrink the particle count one step
                if (elapsed > FRAME_MS * 1.8 && elapsed < 500) {
                    if (++slowFrames > 15 && quality > 0.4) {
                        quality -= 0.25;
                        slowFrames = 0;
                        resize();
                    }
                } else {
                    slowFrames = 0;
                }
                // 3D Параллакс фона авроры со сглаживанием (lerp)
                if (auroraWrap && !lowPower && !reducedMotion) {
                    const viewW = window.innerWidth || W;
                    const viewH = window.innerHeight || H;
                    if (mouse.active && viewW > 0 && viewH > 0) {
                        targetPX = ((mouse.x / viewW) - 0.5) * -22;
                        targetPY = ((mouse.y / viewH) - 0.5) * -16;
                    } else {
                        targetPX = 0;
                        targetPY = 0;
                    }
                    const dPX = targetPX - currentPX;
                    const dPY = targetPY - currentPY;
                    if (Math.abs(dPX) > 0.05 || Math.abs(dPY) > 0.05) {
                        currentPX += dPX * 0.06;
                        currentPY += dPY * 0.06;
                        auroraWrap.style.transform = 'translate3d(' + currentPX.toFixed(2) + 'px,' + currentPY.toFixed(2) + 'px,0)';
                    }
                }

                draw(Math.min(elapsed / 1000, 0.1));
                lastFrame = ts;
            }

            function start() {
                if (!rafId && !reducedMotion) {
                    lastFrame = 0;
                    rafId = requestAnimationFrame(loop);
                }
            }

            function stop() {
                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = 0;
                }
            }

            function applyMode() {
                isLight = (document.documentElement.getAttribute('data-theme') || 'dark') === 'light';
                if (auroraWrap && (lowPower || reducedMotion)) {
                    auroraWrap.style.transform = '';
                }
                if (reducedMotion) {
                    stop();
                    draw(0);
                } else {
                    start();
                }
            }

            // React to theme switches from settings
            new MutationObserver(applyMode)
                .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

            // No work at all while the page is hidden
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) stop(); else if (!isIdle) applyMode();
            });

            // === Idle freeze ===
            // The scene keeps animating even when nobody is looking. After
            // IDLE_MS without any input the canvas stops and .idle on <html>
            // pauses the aurora/glow/neon/weather-icon CSS animations; any
            // input (mouse, keys, scroll) wakes everything instantly.
            const IDLE_MS = 20000;
            let idleTimer = 0;
            let isIdle = false;
            // Not 0: the first wake() call must ARM the idle timer. With 0 the
            // throttle (now - lastWake < 2000) swallowed it, so on a machine
            // with no input after launch the freeze never armed and every
            // scene animation ran forever (constant compositor burn).
            let lastWake = -IDLE_MS;

            function enterIdle() {
                isIdle = true;
                document.documentElement.classList.add('idle');
                stop();
            }

            function wake() {
                const now = performance.now();
                // Input storms (mousemove etc.) reset the timer at most every 2s
                if (!isIdle && now - lastWake < 2000) return;
                lastWake = now;
                if (isIdle) {
                    isIdle = false;
                    document.documentElement.classList.remove('idle');
                    applyMode();
                }
                clearTimeout(idleTimer);
                idleTimer = setTimeout(enterIdle, IDLE_MS);
            }

            ['mousemove', 'mousedown', 'wheel', 'keydown', 'touchstart']
                .forEach(ev => window.addEventListener(ev, wake, { passive: true }));
            wake();

            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    resize();
                    if (reducedMotion) draw(0);
                }, 200);
            });

            resize();
            applyMode();
        })();

        const defaultLinks = [
            { url: 'https://www.youtube.com', title: 'YouTube' },
            { url: 'https://chatgpt.com', title: 'ChatGPT' },
        ];

        let quickLinks = [];
        let quicklinkMenuIndex = -1;
        const quicklinkMenu = document.getElementById('quicklink-menu');
        const quicklinkDelete = document.getElementById('quicklink-delete');
        const addModal = document.getElementById('add-modal');
        const addUrlInput = document.getElementById('add-url');
        const addTitleInput = document.getElementById('add-title');
        const addCancel = document.getElementById('add-cancel');
        const addSave = document.getElementById('add-save');

        const searchInput = document.getElementById('search-input');
        const suggestionsBox = document.getElementById('suggestions');
        let selectedIndex = -1;
        let debounceTimer;

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function applyAccentColor(hex) {
            if (!hex) return;
            const clean = hex.replace('#', '');
            const bi = parseInt(clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean, 16);
            if (isNaN(bi)) return;
            const r = (bi >> 16) & 255;
            const g = (bi >> 8) & 255;
            const b = bi & 255;
            document.documentElement.style.setProperty('--accent', hex);
            document.documentElement.style.setProperty('--accent-rgb', `${r}, ${g}, ${b}`);
            document.documentElement.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.25)`);
        }

        // Auto-focus on load and load accent color
        window.addEventListener('load', async () => {
            searchInput.focus();
            if (window.mauzer?.settings?.load) {
                try {
                    const s = await window.mauzer.settings.load();
                    if (s && s.accentColor) {
                        applyAccentColor(s.accentColor);
                    }
                } catch(e) {}
            }
        });

        // Real-time accent sync when settings update
        window.addEventListener('storage', (e) => {
            if (e.key === 'mauzer-settings' && e.newValue) {
                try {
                    const s = JSON.parse(e.newValue);
                    if (s.accentColor) applyAccentColor(s.accentColor);
                } catch(err) {}
            }
        });

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            clearTimeout(debounceTimer);
            if (!val) {
                hideSuggestions();
                return;
            }
            
            debounceTimer = setTimeout(async () => {
                if (window.mauzer && window.mauzer.search) {
                    try {
                        const results = await window.mauzer.search.suggest(val);
                        renderSuggestions(results);
                    } catch (e) {
                        hideSuggestions();
                    }
                }
            }, 150);
        });

        // Если уже введен текст, при клике/фокусе сразу показать подсказки
        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim()) {
                searchInput.dispatchEvent(new Event('input'));
            }
        });

        searchInput.addEventListener('keydown', (e) => {
            const items = suggestionsBox.querySelectorAll('.suggestion-item');
            if (e.key === 'ArrowDown') {
                if (suggestionsBox.classList.contains('show')) {
                    e.preventDefault();
                    selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                    updateSelection(items);
                }
            } else if (e.key === 'ArrowUp') {
                if (suggestionsBox.classList.contains('show')) {
                    e.preventDefault();
                    selectedIndex = Math.max(selectedIndex - 1, -1);
                    updateSelection(items);
                }
            } else if (e.key === 'Enter') {
                if (selectedIndex >= 0 && items[selectedIndex]) {
                    e.preventDefault();
                    performSearch(items[selectedIndex].dataset.val);
                    hideSuggestions();
                } else {
                    // Default enter behavior handled by existing listener, just hide suggestions
                    hideSuggestions();
                }
            } else if (e.key === 'Escape') {
                hideSuggestions();
            }
        });

        function updateSelection(items) {
            items.forEach((item, i) => {
                item.classList.toggle('selected', i === selectedIndex);
                if (i === selectedIndex) {
                    searchInput.value = item.dataset.val;
                }
            });
        }

        function renderSuggestions(list) {
            if (!list || !list.length) {
                hideSuggestions();
                return;
            }
            
            suggestionsBox.innerHTML = list.map(text => `
                <li class="suggestion-item" data-val="${escapeHtml(text)}">
                    <svg class="suggestion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <span>${escapeHtml(text)}</span>
                </li>
            `).join('');
            
            suggestionsBox.classList.add('show');
            searchInput.classList.add('has-suggestions');
            document.body.classList.add('suggestions-open');
            // Remove rounded corners from search bar wrapper too if needed, 
            // but search-bar class handles it.
            selectedIndex = -1;
        }

        function hideSuggestions() {
            suggestionsBox.classList.remove('show');
            searchInput.classList.remove('has-suggestions');
            document.body.classList.remove('suggestions-open');
            selectedIndex = -1;
        }

        let currentSearchEngine = 'google';
        const searchEngines = {
            google: 'https://www.google.com/search?q=',
            duckduckgo: 'https://duckduckgo.com/?q=',
            brave: 'https://search.brave.com/search?q=',
            bing: 'https://www.bing.com/search?q=',
            yandex: 'https://yandex.com/search/?text='
        };

        function performSearch(val) {
            val = val.trim();
            if (!val) return;
            const isUrl = /^(https?:\/\/|[\w-]+\.[\w-]+)/.test(val);
            const base = searchEngines[currentSearchEngine] || searchEngines.google;
            window.location.href = isUrl
                ? (val.startsWith('http') ? val : 'https://' + val)
                : base + encodeURIComponent(val);
        }

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                hideSuggestions();
            }
        });

        suggestionsBox.addEventListener('click', (e) => {
            const item = e.target.closest('.suggestion-item');
            if (item) {
                performSearch(item.dataset.val);
            }
        });

        function normalizeUrl(input) {
            const trimmed = input.trim();
            if (!trimmed) return null;
            if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) return trimmed;
            return 'https://' + trimmed;
        }

        function filterBlocked(links) {

            const blocked = new Set(['vk.com', 'www.vk.com', 'yandex.ru', 'www.yandex.ru', 'ya.ru', 'mail.ru', 'www.mail.ru', 'ok.ru', 'www.ok.ru', 'rambler.ru']);
            return links.filter(link => {
                try {
                    const host = new URL(link.url).hostname.toLowerCase();
                    return !blocked.has(host) && !host.endsWith('.ru');
                } catch (e) {

                }
            });
        }

        function renderLinks(links) {
            const container = document.getElementById('quick-links');
            container.innerHTML = '';
            links.forEach((link, index) => {
                const a = document.createElement('a');
                a.className = 'quick-link';
                a.href = link.url;
                a.setAttribute('draggable', 'true');
                a.dataset.index = String(index);
                a.innerHTML = `
          <div class="quick-link-icon">
            ${getQuickLinkIcon(link.url, link.title)}
          </div>
          <span class="quick-link-title">${escapeHtml(link.title)}</span>
          <button class="quick-link-menu-btn" type="button">⋯</button>
        `;
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = link.url;
                });
                a.addEventListener('contextmenu', (e) => e.preventDefault());
                const menuBtn = a.querySelector('.quick-link-menu-btn');
                if (menuBtn) {
                    menuBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        showQuicklinkMenu(index, menuBtn);
                    });
                }
                a.addEventListener('dragstart', (e) => onDragStart(e, index));
                a.addEventListener('dragover', (e) => onDragOver(e, index));
                a.addEventListener('drop', (e) => onDrop(e, index));
                a.addEventListener('dragend', () => clearDragState());
                container.appendChild(a);
            });

            const add = document.createElement('button');
            add.type = 'button';
            add.className = 'quick-link quick-link-add';
            add.setAttribute('draggable', 'false');
            add.innerHTML = `
          <div class="quick-link-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

            </svg>
          </div>
          <span class="quick-link-title">Добавить</span>
        `;
            add.addEventListener('click', () => {
                openAddModal();
            });
            container.appendChild(add);

        async function loadLinks() {
            let links = defaultLinks;
            let saved = null;
            if (window.mauzer?.quicklinks?.get) {
                try {
                    saved = await window.mauzer.quicklinks.get();
                    if (Array.isArray(saved) && saved.length) links = saved;
                } catch (e) { }
            }
            const filtered = filterBlocked(links);
            quickLinks = filtered;
            if (saved && window.mauzer?.quicklinks?.save && filtered.length !== saved.length) {
                await window.mauzer.quicklinks.save(filtered);
            }
            renderLinks(quickLinks);
        }

        loadLinks();

        function showQuicklinkMenu(index, anchorEl) {
            quicklinkMenuIndex = index;
            const rect = anchorEl.getBoundingClientRect();
            quicklinkMenu.style.left = Math.max(12, rect.right - 140) + 'px';
            quicklinkMenu.style.top = rect.bottom + 6 + 'px';
            quicklinkMenu.classList.add('show');
        }

        function hideQuicklinkMenu() {
            quicklinkMenuIndex = -1;
            quicklinkMenu.classList.remove('show');
        }

        quicklinkDelete.addEventListener('click', async () => {
            if (quicklinkMenuIndex < 0) return;
            quickLinks = quickLinks.filter((_, i) => i !== quicklinkMenuIndex);
            if (window.mauzer?.quicklinks?.save) {
                await window.mauzer.quicklinks.save(quickLinks);
            }
            renderLinks(quickLinks);
            hideQuicklinkMenu();
        });

        document.addEventListener('click', (e) => {
            if (!quicklinkMenu.contains(e.target)) hideQuicklinkMenu();
        });

        let dragIndex = -1;
        function onDragStart(e, index) {
            dragIndex = index;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(index));
        }
        function onDragOver(e, index) {
            if (index === dragIndex) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }
        async function onDrop(e, index) {
            e.preventDefault();
            if (dragIndex < 0 || dragIndex === index) return;
            const next = quickLinks.slice();
            const [moved] = next.splice(dragIndex, 1);
            next.splice(index, 0, moved);
            quickLinks = next;
            if (window.mauzer?.quicklinks?.save) {
                await window.mauzer.quicklinks.save(quickLinks);
            }
            renderLinks(quickLinks);
            clearDragState();
        }
        function clearDragState() {
            dragIndex = -1;

        function guessTitleFromUrl(urlStr) {
            if (!urlStr) return '';
            try {
                let norm = urlStr.trim();
                if (!norm.startsWith('http://') && !norm.startsWith('https://')) norm = 'https://' + norm;
                const host = new URL(norm).hostname.toLowerCase().replace(/^www\./, '');
                for (const [domain, name] of Object.entries(KNOWN_SITE_TITLES)) {
                    if (host === domain || host.endsWith('.' + domain)) return name;
                }
                const parts = host.split('.');
                if (parts.length >= 2) {
                    const core = parts[parts.length - 2];
                    if (core) return core.charAt(0).toUpperCase() + core.slice(1);
                }
                return host;
            } catch (e) {
                return '';
            }
        }

        const previewTileTitle = document.getElementById('preview-tile-title');

        const addUrlClear = document.getElementById('add-url-clear');
        const addTitleClear = document.getElementById('add-title-clear');

        function updateModalPreview() {
            const rawUrl = addUrlInput.value.trim();
            const titleVal = addTitleInput.value.trim();

            if (addUrlClear) addUrlClear.style.display = rawUrl ? 'inline-flex' : 'none';
            if (addTitleClear) addTitleClear.style.display = titleVal ? 'inline-flex' : 'none';

            const normUrl = rawUrl ? (normalizeUrl(rawUrl) || rawUrl) : '';
            const guessed = normUrl ? guessTitleFromUrl(normUrl) : '';
            const displayTitle = titleVal || guessed || 'Новый сайт';
            const displayUrl = normUrl || 'https://example.com';

            if (previewTileTitle) previewTileTitle.textContent = displayTitle;
            if (previewTileUrl) previewTileUrl.textContent = displayUrl;

            if (previewFaviconBox) {
                if (normUrl) {
                    previewFaviconBox.innerHTML = getQuickLinkIcon(normUrl, displayTitle);

                    previewFaviconBox.innerHTML = `

            }
        }

        addUrlInput.addEventListener('input', () => {
            if (!addTitleInput.dataset.userEdited) {
                const guessed = guessTitleFromUrl(addUrlInput.value);
                if (guessed) addTitleInput.value = guessed;

            updateModalPreview();

        function openAddModal() {

        async function saveQuickLink() {
            const rawUrl = addUrlInput.value;
            const url = normalizeUrl(rawUrl);
            if (!url) {
                addUrlInput.focus();
                return;
            }
            let hostname = '';
            try { hostname = new URL(url).hostname; } catch (e) { }
            const title = (addTitleInput.value || hostname || url).trim();
            if (!title) return;
            quickLinks.push({ url, title });
            if (window.mauzer?.quicklinks?.save) {
                await window.mauzer.quicklinks.save(quickLinks);
            }
            renderLinks(quickLinks);
            closeAddModal();
        }

        }

        // Apply theme (settings win over the URL param — a stale ?theme= baked
        // into the tab URL must not survive a reload; the param is only used
        // for the first paint and as a fallback when settings are unavailable)
        const params = new URLSearchParams(window.location.search);
        const themeFromParam = params.get('theme');

        function applyTheme(theme) {
            const t = (theme || 'dark').toLowerCase();
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark';
        }

        if (themeFromParam) {
            applyTheme(themeFromParam);
        }
        if (window.mauzer?.settings?.load) {
            window.mauzer.settings.load().then(s => {
                applyTheme(s?.theme || 'dark');
                if (s?.searchEngine) currentSearchEngine = s.searchEngine;
            }).catch(() => {});
        }

        if (window.mauzer?.settings?.onChanged) {
            window.mauzer.settings.onChanged((s) => {
                applyTheme(s?.theme || 'dark');
                if (s?.searchEngine) currentSearchEngine = s.searchEngine;
            });
        }

        // === WEATHER LOGIC ===
        async function initWeather() {
            const widget = document.getElementById('weather-widget');
            const iconEl = document.getElementById('weather-icon');
            const tempEl = document.getElementById('weather-temp');
            const locEl = document.getElementById('weather-loc');
            const humidityEl = document.getElementById('weather-humidity');
            const windEl = document.getElementById('weather-wind');
            const forecastEl = document.getElementById('weather-forecast');
            const hourlyEl = document.getElementById('weather-hourly');

            // Privacy: weather resolves the user's location via IP geolocation
            // services. When the setting is off — hide the widget and make zero
            // network requests. Toggling the setting reloads this page.
            let weatherShown = true;
            try {
                const s = await window.mauzer.settings.load();
                if (s && s.weatherEnabled === false) {
                    weatherShown = false;
                    widget.style.display = 'none';
                    return;
                }
                if (window.mauzer.settings.onChanged) {
                    window.mauzer.settings.onChanged((ns) => {
                        const on = !ns || ns.weatherEnabled !== false;
                        if (on !== weatherShown) location.reload();
                    });
                }
            } catch (e) { }

            // Click widget -> toggle expanded.
            // Width is pinned to explicit px before toggling, because CSS cannot
            // animate between a fixed width and `auto` — without this the
            // collapse would snap instantly.
            // Natural collapsed width, measured ahead of time. Measuring it
            // inside the click handler (class flip-flop) breaks the height
            // transition, so it's cached instead.
            let naturalW = 98;
            function measureNatural() {
                if (!widget.classList.contains('expanded')) {
                    naturalW = Math.round(widget.getBoundingClientRect().width) || naturalW;
                }
            }

            function setWidgetExpanded(expanded) {
                const isExpanded = widget.classList.contains('expanded');
                if (isExpanded === expanded) return;

                if (!isExpanded) {
                    naturalW = Math.round(widget.getBoundingClientRect().width) || naturalW;
                }

                const current = widget.getBoundingClientRect().width;
                widget.style.width = current + 'px';
                void widget.offsetWidth;

                widget.classList.toggle('expanded', expanded);
                const target = expanded ? 300 : naturalW;
                widget.style.width = target + 'px';

                clearTimeout(widget._widthTimer);
                widget._widthTimer = setTimeout(() => {
                    widget.style.width = '';
                }, 350);
            }

            widget.addEventListener('click', (e) => {
                if (e.target.closest('#weather-loc')) return;
                setWidgetExpanded(!widget.classList.contains('expanded'));
            });

            document.addEventListener('click', (e) => {
                if (widget.classList.contains('expanded') && !widget.contains(e.target)) {
                    setWidgetExpanded(false);
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && widget.classList.contains('expanded')) {
                    setWidgetExpanded(false);
                }
            });

            const wmoToKey = (c, isDay = true) => {
                if (isDay) {
                    if (c >= 1 && c <= 2) return 'cloud-sun';
                    if (c === 3) return 'cloud';
                    if (c >= 45 && c <= 48) return 'fog';
                    if (c >= 51 && c <= 67) return 'rain';
                    if (c >= 71 && c <= 86) return 'snow';
                    if (c >= 95) return 'thunder';
                    return 'sun';
                } else {
                    if (c >= 1 && c <= 2) return 'cloud-moon';
                    if (c === 3) return 'cloud-night';
                    if (c >= 45 && c <= 48) return 'fog-night';
                    if (c >= 51 && c <= 67) return 'rain-night';
                    if (c >= 71 && c <= 86) return 'snow-night';
                    if (c >= 95) return 'thunder-night';
                    return 'moon';
                }
            };

            const iconsSvg = {
                'sun': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>',
                'moon': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="rgba(250, 204, 21, 0.25)"/></svg>',
                'cloud-sun': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4" stroke="#fbbf24" stroke-width="2" fill="#fbbf24"/><path d="M19 19H8.5a4.5 4.5 0 0 1-1.2-8.8A4 4 0 0 1 15 8.5a4.5 4.5 0 0 1 4 4.5 3 3 0 0 1 0 6z" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8"/></svg>',
                'cloud-moon': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(1, 0) scale(0.62)"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#facc15" stroke="#facc15" stroke-width="2"/></g><path d="M19 19H8.5a4.5 4.5 0 0 1-1.2-8.8A4 4 0 0 1 15 8.5a4.5 4.5 0 0 1 4 4.5 3 3 0 0 1 0 6z" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8"/></svg>',
                'cloud': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" fill="#1e293b"/></svg>',
                'cloud-night': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" fill="#1e293b"/></svg>',
                'rain': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17H8.5a4.5 4.5 0 0 1-1.2-8.8A4 4 0 0 1 15 6.5a4.5 4.5 0 0 1 4 4.5 3 3 0 0 1 0 6z" fill="#1e293b" stroke="#60a5fa" stroke-width="1.8"/><path d="M8 19v2M12 19v2M16 19v2" stroke="#60a5fa" stroke-width="2"/></svg>',
                'rain-night': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(1, -1) scale(0.58)"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#facc15" stroke="#facc15" stroke-width="2"/></g><path d="M19 17H8.5a4.5 4.5 0 0 1-1.2-8.8A4 4 0 0 1 15 6.5a4.5 4.5 0 0 1 4 4.5 3 3 0 0 1 0 6z" fill="#1e293b" stroke="#60a5fa" stroke-width="1.8"/><path d="M8 19v2M12 19v2M16 19v2" stroke="#60a5fa" stroke-width="2"/></svg>',
                'snow': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17H8.5a4.5 4.5 0 0 1-1.2-8.8A4 4 0 0 1 15 6.5a4.5 4.5 0 0 1 4 4.5 3 3 0 0 1 0 6z" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.8"/><circle cx="8" cy="20" r="0.8" fill="#e2e8f0"/><circle cx="12" cy="20" r="0.8" fill="#e2e8f0"/><circle cx="16" cy="20" r="0.8" fill="#e2e8f0"/></svg>',
                'snow-night': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(1, -1) scale(0.58)"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#facc15" stroke="#facc15" stroke-width="2"/></g><path d="M19 17H8.5a4.5 4.5 0 0 1-1.2-8.8A4 4 0 0 1 15 6.5a4.5 4.5 0 0 1 4 4.5 3 3 0 0 1 0 6z" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.8"/><circle cx="8" cy="20" r="0.8" fill="#e2e8f0"/><circle cx="12" cy="20" r="0.8" fill="#e2e8f0"/><circle cx="16" cy="20" r="0.8" fill="#e2e8f0"/></svg>',
                'thunder': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17H8.5a4.5 4.5 0 0 1-1.2-8.8A4 4 0 0 1 15 6.5a4.5 4.5 0 0 1 4 4.5 3 3 0 0 1 0 6z" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8"/><path d="M12 13l-2 4h3l-1.5 4" stroke="#fbbf24" stroke-width="2"/></svg>',
                'thunder-night': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(1, -1) scale(0.58)"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#facc15" stroke="#facc15" stroke-width="2"/></g><path d="M19 17H8.5a4.5 4.5 0 0 1-1.2-8.8A4 4 0 0 1 15 6.5a4.5 4.5 0 0 1 4 4.5 3 3 0 0 1 0 6z" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8"/><path d="M12 13l-2 4h3l-1.5 4" stroke="#fbbf24" stroke-width="2"/></svg>',
                'fog': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14M3 12h18M5 16h14M7 20h10"/></svg>',
                'fog-night': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(1, -2) scale(0.58)"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#facc15" stroke="#facc15" stroke-width="2"/></g><path d="M5 13h14M3 16h18M6 19h12" stroke="#9ca3af" stroke-width="2"/></svg>'
            };

            // data:image versions for forecast <img>
            const iconsDataUri = {};
            for (const [k, v] of Object.entries(iconsSvg)) {
                iconsDataUri[k] = 'data:image/svg+xml,' + encodeURIComponent(v);
            }

            // Animated main icon: drifting cloud, falling rain/snow, flashing
            // bolt, spinning sun rays, and glowing/twinkling night moon scenes
            const buildAnimatedIcon = (kind) => {
                const cloudSvg = (color) =>
                    `<svg class="wi-cloud" viewBox="0 0 24 24" fill="var(--wi-cloud-fill)" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`;

                // === Day Scenes ===
                if (kind === 'sun') {
                    return `<div class="wi-scene"><svg class="wi-sun" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><g class="wi-rays"><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></g></svg></div>`;
                }
                if (kind === 'cloud-sun') {
                    return `<div class="wi-scene"><svg class="wi-daysun" viewBox="0 0 32 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="#fbbf24" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M9 2.4V0.6M3.4 8H1.6M4 3l-1.3-1.3M14 3l1.3-1.3"/></g><g class="wi-cloud-g"><path d="M23.5 22.5H13a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" fill="var(--wi-cloud-fill)" stroke="#94a3b8" stroke-width="1.9"/></g></svg></div>`;
                }
                if (kind === 'cloud') {
                    return `<div class="wi-scene">${cloudSvg('#94a3b8')}</div>`;
                }
                if (kind === 'rain') {
                    return `<div class="wi-scene">${cloudSvg('#60a5fa')}<span class="wi-drop d1"></span><span class="wi-drop d2"></span><span class="wi-drop d3"></span></div>`;
                }
                if (kind === 'snow') {
                    return `<div class="wi-scene">${cloudSvg('#e2e8f0')}<span class="wi-flake s1"></span><span class="wi-flake s2"></span><span class="wi-flake s3"></span></div>`;
                }
                if (kind === 'thunder') {
                    return `<div class="wi-scene">${cloudSvg('#94a3b8')}<svg class="wi-bolt" viewBox="0 0 24 24"><path d="M13 2 L8.5 13 L12 13 L10 22 L16 10.5 L12.5 10.5 Z" fill="#fbbf24"/></svg><span class="wi-drop d1"></span><span class="wi-drop d3"></span></div>`;
                }
                if (kind === 'fog') {
                    return `<div class="wi-scene">${cloudSvg('#9ca3af')}<span class="wi-fogline f1"></span><span class="wi-fogline f2"></span></div>`;
                }

                // === Night Scenes ===
                const nightCloudSvg = (color) =>
                    `<svg class="wi-nightcloud" viewBox="0 0 32 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><g class="wi-moon-sub" transform="translate(1.5, 0.5) scale(0.68)"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#facc15" stroke="#facc15" stroke-width="1.8"/></g><g class="wi-cloud-g"><path d="M23.5 22.5H13a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" fill="var(--wi-cloud-fill)" stroke="${color}" stroke-width="1.9"/></g></svg>`;

                if (kind === 'moon') {
                    return `<div class="wi-scene"><svg class="wi-moon" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="rgba(250, 204, 21, 0.22)"/></svg><span class="wi-star s1">✦</span><span class="wi-star s2">✦</span></div>`;
                }
                if (kind === 'cloud-moon') {
                    return `<div class="wi-scene">${nightCloudSvg('#818cf8')}</div>`;
                }
                if (kind === 'cloud-night') {
                    return `<div class="wi-scene">${cloudSvg('#818cf8')}</div>`;
                }
                if (kind === 'rain-night') {
                    return `<div class="wi-scene">${nightCloudSvg('#60a5fa')}<span class="wi-drop d1"></span><span class="wi-drop d2"></span><span class="wi-drop d3"></span></div>`;
                }
                if (kind === 'snow-night') {
                    return `<div class="wi-scene">${nightCloudSvg('#e2e8f0')}<span class="wi-flake s1"></span><span class="wi-flake s2"></span><span class="wi-flake s3"></span></div>`;
                }
                if (kind === 'thunder-night') {
                    return `<div class="wi-scene">${nightCloudSvg('#818cf8')}<svg class="wi-bolt" viewBox="0 0 24 24"><path d="M13 2 L8.5 13 L12 13 L10 22 L16 10.5 L12.5 10.5 Z" fill="#fbbf24"/></svg><span class="wi-drop d1"></span><span class="wi-drop d3"></span></div>`;
                }
                if (kind === 'fog-night') {
                    return `<div class="wi-scene"><svg class="wi-moon" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="rgba(250, 204, 21, 0.22)"/></svg><span class="wi-fogline f1"></span><span class="wi-fogline f2"></span></div>`;
                }

                return buildAnimatedIcon('sun');
            };

            // Swaps the icon immediately without blank delay
            const setWeatherIcon = (kind) => {
                const html = buildAnimatedIcon(kind);
                if (iconEl.innerHTML === html) return;
                iconEl.innerHTML = html;
                iconEl.style.opacity = '1';
            };

            const DEFAULT_LOC = {
                lat: 50.06602,
                lon: 35.16275,
                city: 'Краснокутськ'
            };

            function getSavedLocation() {
                try {
                    const cached = JSON.parse(localStorage.getItem('mauzer-weather-loc') || 'null');
                    if (cached && cached.city && !/европа|europe|unknown|украина|ukraine/i.test(cached.city) && isFinite(cached.lat) && isFinite(cached.lon)) {
                        return {
                            lat: cached.lat,
                            lon: cached.lon,
                            city: (cached.city === 'Краснокутск' || cached.city === 'Krasnokutsk') ? 'Краснокутськ' : cached.city
                        };
                    }
                } catch (e) { }
                return DEFAULT_LOC;
            }

            function applyWeatherData(weather, cityName) {
                if (!weather) return;
                const cur = weather.current || {};
                const temp = Math.round(cur.temperature_2m ?? cur.temperature ?? 0);
                const code = cur.weathercode ?? 0;
                const humidity = Math.round(cur.relative_humidity_2m ?? 0);
                const wind = Math.round(cur.wind_speed_10m ?? 0);
                const isDay = (cur.is_day !== undefined) ? Boolean(cur.is_day) : (() => {
                    const hr = new Date().getHours();
                    return hr >= 6 && hr < 21;
                })();
                const icon = wmoToKey(code, isDay);

                setWeatherIcon(icon);
                tempEl.textContent = `${temp > 0 ? '+' : ''}${temp}°`;
                const displayCity = (!cityName || /европа|europe|unknown|украина|ukraine/i.test(cityName)) ? 'Краснокутськ' : cityName;
                locEl.textContent = displayCity;
                locEl.title = `${displayCity} (нажмите, чтобы изменить город)`;
                humidityEl.textContent = `${humidity}%`;
                windEl.textContent = `${wind} м/с`;

                // Next 4 hours forecast
                if (hourlyEl) {
                    hourlyEl.innerHTML = '';
                    const curTimeStr = weather.current?.time || '';
                    const hasHourly = weather?.hourly?.time && Array.isArray(weather.hourly.time);
                    let curIdx = hasHourly ? weather.hourly.time.findIndex(t => t.startsWith(curTimeStr.slice(0, 13))) : -1;
                    if (curIdx < 0 && hasHourly) {
                        const nowHour = new Date().getHours();
                        curIdx = weather.hourly.time.findIndex(t => new Date(t).getHours() === nowHour);
                    }
                    if (curIdx < 0) curIdx = 0;

                    const nowHr = new Date().getHours();
                    hourlyEl.innerHTML = [1, 2, 3, 4].map(step => {
                        let hourPart = '';
                        let hTemp = temp;
                        let hCode = code;
                        let hIsDay = isDay;

                        if (hasHourly) {
                            const idx = curIdx + step;
                            const timeStr = weather.hourly.time[idx];
                            if (timeStr) {
                                hourPart = timeStr.split('T')[1] || '';
                                hTemp = Math.round(weather.hourly.temperature_2m[idx] ?? temp);
                                hCode = weather.hourly.weathercode[idx] ?? code;
                                hIsDay = (weather.hourly.is_day && weather.hourly.is_day[idx] !== undefined)
                                    ? Boolean(weather.hourly.is_day[idx])
                                    : (() => {
                                        const h = parseInt(hourPart.split(':')[0], 10);
                                        return h >= 6 && h < 21;
                                    })();
                            }
                        }

                        if (!hourPart) {
                            const nextH = (nowHr + step) % 24;
                            hourPart = `${nextH < 10 ? '0' : ''}${nextH}:00`;
                            hIsDay = nextH >= 6 && nextH < 21;
                        }

                        const hIcon = iconsDataUri[wmoToKey(hCode, hIsDay)] || iconsDataUri['sun'];

                        return `<div class="hourly-item">
                            <span class="hourly-rel">+${step} ч</span>
                            <span class="hourly-clock">${hourPart}</span>
                            <img class="hourly-icon" src="${hIcon}" alt="" />
                            <span class="hourly-temp">${hTemp > 0 ? '+' : ''}${hTemp}°</span>
                        </div>`;
                    }).join('');
                }

                if (forecastEl && weather?.daily?.time && Array.isArray(weather.daily.time)) {
                    forecastEl.innerHTML = '';
                    const times = weather.daily.time;
                    const maxTemps = weather.daily.temperature_2m_max || [];
                    const minTemps = weather.daily.temperature_2m_min || [];
                    const codes = weather.daily.weathercode || [];

                    const todayIdx = times.findIndex(t => t === (cur.time || '').split('T')[0]);
                    const labels = ['Завтра', 'Послезавтра', 'Через 3 дня'];

                    forecastEl.innerHTML = [1, 2, 3].map((offset, idx) => {
                        const i = todayIdx >= 0 ? todayIdx + offset : offset;
                        if (!times[i]) return '';
                        const max = Math.round(maxTemps[i] ?? temp);
                        const min = Math.round(minTemps[i] ?? temp);
                        const fIcon = iconsDataUri[wmoToKey(codes[i] ?? 0, true)];
                        return `<div class="forecast-item">
                            <span class="forecast-day">${labels[idx]}</span>
                            <div class="forecast-meta">
                                <img class="forecast-icon" src="${fIcon}" alt="" />
                                <span class="forecast-temp">${max > 0 ? '+' : ''}${max}° / ${min > 0 ? '+' : ''}${min}°</span>
                            </div>
                        </div>`;
                    }).join('');
                }
            }

            // Click location text to edit/change town directly
            locEl.addEventListener('click', async (e) => {
                e.stopPropagation();
                const cur = locEl.textContent.trim() || 'Краснокутськ';
                const input = prompt('Введите город (например: Краснокутськ, Харьков, Киев):', cur);
                if (!input || !input.trim()) return;
                const q = input.trim();
                if (/краснокутск|krasnokutsk/i.test(q)) {
                    const loc = DEFAULT_LOC;
                    try { localStorage.setItem('mauzer-weather-loc', JSON.stringify({ ...loc, ts: Date.now() })); } catch (e) { }
                    locEl.textContent = 'Краснокутськ';
                    await loadWeather();
                    measureNatural();
                    return;
                }
                try {
                    const prevText = locEl.textContent;
                    locEl.textContent = 'Поиск...';
                    const controller = new AbortController();
                    const tId = setTimeout(() => controller.abort(), 4000);
                    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=ru&format=json`, { signal: controller.signal });
                    clearTimeout(tId);
                    if (!geoRes.ok) throw new Error('Geocoding error');
                    const geoData = await geoRes.json();
                    if (geoData.results && geoData.results.length > 0) {
                        const r = geoData.results[0];
                        const newLoc = { lat: r.latitude, lon: r.longitude, city: r.name };
                        try { localStorage.setItem('mauzer-weather-loc', JSON.stringify({ ...newLoc, ts: Date.now() })); } catch (e) { }
                        locEl.textContent = r.name;
                        await loadWeather();
                        measureNatural();
                    } else {
                        alert('Город не найден');
                        locEl.textContent = prevText;
                    }
                } catch (err) {
                    locEl.textContent = cur;
                }
            });

            async function loadWeather() {
                const loc = getSavedLocation();
                locEl.textContent = loc.city || 'Краснокутськ';

                try {
                    let weather = null;

                    // 1. Primary API: Open-Meteo with current, hourly (for +4h) and daily (for 3 days)
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 5000);
                        const weatherRes = await fetch(
                            `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weathercode,relative_humidity_2m,wind_speed_10m,is_day&hourly=temperature_2m,weathercode,is_day&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto`,
                            { signal: controller.signal }
                        );
                        clearTimeout(timeoutId);
                        if (weatherRes.ok) weather = await weatherRes.json();
                    } catch (e1) {
                        console.warn('Open-Meteo failed, trying backup API...', e1);
                    }

                    // 2. Backup API: wttr.in if Open-Meteo is unreachable
                    if (!weather) {
                        try {
                            const controller2 = new AbortController();
                            const timeoutId2 = setTimeout(() => controller2.abort(), 5000);
                            const res2 = await fetch(`https://wttr.in/Krasnokutsk?format=j1`, { signal: controller2.signal });
                            clearTimeout(timeoutId2);
                            if (res2.ok) {
                                const w2 = await res2.json();
                                const c2 = w2.current_condition?.[0] || {};
                                const nowHour = new Date().getHours();
                                const hourlyTimes = [];
                                const hourlyTemps = [];
                                const hourlyCodes = [];
                                const hourlyIsDay = [];
                                const todayH = w2.weather?.[0]?.hourly || [];
                                for (let h = 0; h < 24; h++) {
                                    const timeStr = `${new Date().toISOString().slice(0, 10)}T${h < 10 ? '0' : ''}${h}:00`;
                                    const hObj = todayH[Math.floor(h / 3)] || {};
                                    hourlyTimes.push(timeStr);
                                    hourlyTemps.push(parseInt(hObj.tempC || c2.temp_C || '10', 10));
                                    hourlyCodes.push(parseInt(hObj.weatherCode || '0', 10) > 200 ? 61 : 0);
                                    hourlyIsDay.push((h >= 6 && h < 21) ? 1 : 0);
                                }
                                weather = {
                                    current: {
                                        time: new Date().toISOString().slice(0, 16),
                                        temperature_2m: parseInt(c2.temp_C || '10', 10),
                                        weathercode: 1,
                                        relative_humidity_2m: parseInt(c2.humidity || '80', 10),
                                        wind_speed_10m: Math.round(parseInt(c2.windspeedKmph || '5', 10) / 3.6),
                                        is_day: (nowHour >= 6 && nowHour < 21) ? 1 : 0
                                    },
                                    hourly: {
                                        time: hourlyTimes,
                                        temperature_2m: hourlyTemps,
                                        weathercode: hourlyCodes,
                                        is_day: hourlyIsDay
                                    },
                                    daily: {
                                        time: (w2.weather || []).map(d => d.date),
                                        temperature_2m_max: (w2.weather || []).map(d => parseInt(d.maxtempC || '20', 10)),
                                        temperature_2m_min: (w2.weather || []).map(d => parseInt(d.mintempC || '10', 10)),
                                        weathercode: [1, 1, 1]
                                    }
                                };
                            }
                        } catch (e2) {
                            console.warn('Backup weather API failed:', e2);
                        }
                    }

                    if (weather) {
                        applyWeatherData(weather, loc.city);

                        try {
                            localStorage.setItem('mauzer-weather-cached', JSON.stringify({
                                weather,
                                city: loc.city,
                                ts: Date.now()
                            }));
                            localStorage.setItem('mauzer-weather-loc', JSON.stringify({
                                ...loc,
                                ts: Date.now()
                            }));
                        } catch (e) { }
                    }
                } catch (e) {
                    console.warn('Weather update error:', e);
                    locEl.textContent = loc.city || 'Краснокутськ';
                }
            }

            // 1. Instantly render from cached data if available (0ms delay!)
            try {
                const cachedData = JSON.parse(localStorage.getItem('mauzer-weather-cached') || 'null');
                if (cachedData && cachedData.weather) {
                    applyWeatherData(cachedData.weather, cachedData.city || 'Краснокутськ');
                } else {
                    locEl.textContent = 'Краснокутськ';
                }
            } catch (e) {
                locEl.textContent = 'Краснокутськ';
            }

            // 2. Fetch fresh weather in the background
            await loadWeather();
            measureNatural();
            setInterval(async () => {
                await loadWeather();
                measureNatural();
            }, 30 * 60 * 1000);
            window.addEventListener('resize', measureNatural);
        }

        // === CURRENCY LOGIC (USD & EUR to UAH) ===
        async function initCurrency() {
            const widget = document.getElementById('currency-widget');
            if (!widget) return;

            const usdValEl = document.getElementById('currency-usd-val');
            const eurValEl = document.getElementById('currency-eur-val');
            const refreshBtn = document.getElementById('currency-refresh-btn');

            const CACHE_KEY = 'mauzer_currency_rates_v1';
            let cached = null;
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (raw) cached = JSON.parse(raw);
            } catch (e) { }

            function updateDisplay(usd, eur, dateStr) {
                if (usd && !isNaN(usd)) {
                    usdValEl.textContent = Number(usd).toFixed(2);
                }
                if (eur && !isNaN(eur)) {
                    eurValEl.textContent = Number(eur).toFixed(2);
                }
                const titleText = `Курс НБУ: 1 USD = ${Number(usd).toFixed(2)} ₴ · 1 EUR = ${Number(eur).toFixed(2)} ₴` +
                    (dateStr ? ` (${dateStr})` : '') + '\nНатисніть для оновлення';
                widget.title = titleText;
            }

            // 1. Instant render from cached rates
            if (cached && cached.usd && cached.eur) {
                updateDisplay(cached.usd, cached.eur, cached.date);
            }

            let isFetching = false;
            async function fetchRates(force = false) {
                if (isFetching) return;

                // If cache is fresh (under 30 mins) and not forced, skip network fetch
                if (!force && cached && cached.timestamp && (Date.now() - cached.timestamp < 30 * 60 * 1000)) {
                    return;
                }

                isFetching = true;
                if (refreshBtn) refreshBtn.classList.add('spinning');

                try {
                    let usdRate = null;
                    let eurRate = null;
                    let dateStr = '';

                    // 1. Official NBU API
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 6000);
                        const res = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json', {
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        if (res.ok) {
                            const list = await res.json();
                            if (Array.isArray(list)) {
                                const usdItem = list.find(c => c.cc === 'USD');
                                const eurItem = list.find(c => c.cc === 'EUR');
                                if (usdItem && usdItem.rate) usdRate = usdItem.rate;
                                if (eurItem && eurItem.rate) eurRate = eurItem.rate;
                                if (usdItem && usdItem.exchangedate) dateStr = usdItem.exchangedate;
                            }
                        }
                    } catch (nbuErr) {
                        console.warn('NBU currency fetch error:', nbuErr);
                    }

                    // 2. Fallback to OpenER API if NBU is unreachable
                    if (!usdRate || !eurRate) {
                        try {
                            const fbRes = await fetch('https://open.er-api.com/v6/latest/USD');
                            if (fbRes.ok) {
                                const fbData = await fbRes.json();
                                if (fbData && fbData.rates && fbData.rates.UAH) {
                                    usdRate = fbData.rates.UAH;
                                    if (fbData.rates.EUR) {
                                        eurRate = fbData.rates.UAH / fbData.rates.EUR;
                                    }
                                    dateStr = 'оновлено';
                                }
                            }
                        } catch (fbErr) {
                            console.warn('Fallback currency fetch error:', fbErr);
                        }
                    }

                    if (usdRate && eurRate) {
                        updateDisplay(usdRate, eurRate, dateStr);
                        const data = {
                            usd: usdRate,
                            eur: eurRate,
                            date: dateStr,
                            timestamp: Date.now()
                        };
                        cached = data;
                        try {
                            localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                        } catch (e) { }
                    }
                } catch (err) {
                    console.error('Currency update error:', err);
                } finally {
                    isFetching = false;
                    setTimeout(() => {
                        if (refreshBtn) refreshBtn.classList.remove('spinning');
                    }, 650);
                }
            }

            // Click on widget to refresh rates
            widget.addEventListener('click', () => {
                fetchRates(true);
            });

            // Initial fetch in background
            await fetchRates();

            // Refresh periodically every 30 minutes
            setInterval(() => fetchRates(), 30 * 60 * 1000);
        }

        // === RECENT SITES LOGIC (Up to 8 recently opened sites) ===
        async function initRecentSites() {
            const wrapEl = document.getElementById('recent-sites-wrap');
            const listEl = document.getElementById('recent-sites-list');
            if (!wrapEl || !listEl) return;

            let historyList = [];
            try {
                if (window.mauzer && window.mauzer.history && window.mauzer.history.get) {
                    historyList = await window.mauzer.history.get();
                }
            } catch (e) { }

            // Deduplicate by host and filter invalid/internal URLs
            const seenHosts = new Set();
            const recentSites = [];

            if (Array.isArray(historyList)) {
                for (const item of historyList) {
                    if (!item || !item.url) continue;
                    try {
                        const parsed = new URL(item.url);
                        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') continue;
                        const host = parsed.hostname.replace(/^www\./, '');
                        if (!host || seenHosts.has(host)) continue;
                        seenHosts.add(host);

                        let title = (item.title || '').trim();
                        if (!title || title === item.url || title.toLowerCase() === 'mauzer' || title.startsWith('http://') || title.startsWith('https://')) {
                            title = host;
                        }

                        recentSites.push({
                            url: item.url,
                            title: title,
                            host: host,
                            favicon: item.favicon || ''
                        });

                        if (recentSites.length >= 8) break;
                    } catch (e) { }
                }
            }

            const knownNames = {
                'youtube': 'YouTube',
                'google': 'Google',
                'chatgpt': 'ChatGPT',
                'github': 'GitHub',
                'reddit': 'Reddit',
                'wikipedia': 'Wikipedia',
                'discord': 'Discord',
                'twitch': 'Twitch',
                'facebook': 'Facebook',
                'instagram': 'Instagram',
                'spotify': 'Spotify',
                'twitter': 'X'
            };

            const knownColors = {
                'youtube': '#ff0000',
                'google': '#4285f4',
                'chatgpt': '#10a37f',
                'github': '#8b5cf6',
                'reddit': '#ff4500',
                'wikipedia': '#64748b',
                'discord': '#5865f2',
                'twitch': '#9146ff',
                'facebook': '#1877f2',
                'instagram': '#e4405f',
                'spotify': '#1ed760'
            };

            // Fallback sites if history has fewer items or is empty
            if (recentSites.length === 0) {
                const defaults = [
                    { title: 'YouTube', host: 'youtube.com', url: 'https://youtube.com', color: '#ff0000' },
                    { title: 'Google', host: 'google.com', url: 'https://google.com', color: '#4285f4' },
                    { title: 'ChatGPT', host: 'chatgpt.com', url: 'https://chatgpt.com', color: '#10a37f' },
                    { title: 'GitHub', host: 'github.com', url: 'https://github.com', color: '#8b5cf6' },
                    { title: 'Wikipedia', host: 'wikipedia.org', url: 'https://wikipedia.org', color: '#64748b' },
                    { title: 'Reddit', host: 'reddit.com', url: 'https://reddit.com', color: '#ff4500' },
                    { title: 'Discord', host: 'discord.com', url: 'https://discord.com', color: '#5865f2' },
                    { title: 'Twitch', host: 'twitch.tv', url: 'https://twitch.tv', color: '#9146ff' }
                ];
                for (const d of defaults) {
                    recentSites.push(d);
                    if (recentSites.length >= 8) break;
                }
            }

            listEl.innerHTML = '';
            const fragment = document.createDocumentFragment();

            for (const site of recentSites) {
                const a = document.createElement('a');
                a.className = 'recent-chip';
                a.href = site.url;

                const hostKey = (site.host || '').replace(/\.(com|org|net|io|ua|app|dev|co|uk|tv)$/i, '').toLowerCase();
                let displayTitle = site.title;
                if (!displayTitle || displayTitle === site.url || displayTitle === site.host || displayTitle.toLowerCase() === 'mauzer' || displayTitle.startsWith('http')) {
                    displayTitle = knownNames[hostKey] || (hostKey.charAt(0).toUpperCase() + hostKey.slice(1));
                }

                a.title = `${displayTitle}\n${site.url}`;

                const brandColor = site.color || knownColors[hostKey] || null;

                let iconEl;
                if (site.favicon) {
                    const img = document.createElement('img');
                    img.className = 'recent-chip-icon';
                    img.src = site.favicon;
                    img.alt = '';
                    img.loading = 'lazy';
                    img.onerror = () => {
                        img.replaceWith(createFallbackLetter(displayTitle || site.host, brandColor));
                    };
                    iconEl = img;
                } else {
                    iconEl = createFallbackLetter(displayTitle || site.host, brandColor);
                }

                const titleSpan = document.createElement('span');
                titleSpan.className = 'recent-chip-title';
                titleSpan.textContent = displayTitle;

                a.appendChild(iconEl);
                a.appendChild(titleSpan);

                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = site.url;
                });

                fragment.appendChild(a);
            }

            listEl.appendChild(fragment);

            function createFallbackLetter(text, dotColor) {
                const letter = (text || '?').charAt(0).toUpperCase();
                const span = document.createElement('span');
                span.className = 'recent-chip-letter';
                if (dotColor) span.style.background = dotColor;
                span.textContent = letter;
                return span;
            }
        }

        initWeather();
        initCurrency();
        initRecentSites();
    </script>
